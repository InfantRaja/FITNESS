<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — FitTrack</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body class="auth-wrapper">

  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="brand-logo" style="justify-content: center;">
        <div class="brand-icon">F</div>
        <span>Fit<span class="text-primary">Track</span></span>
      </a>
      <h2 class="auth-title">Reset Password</h2>
      <p class="auth-subtitle">Enter your registered email to request a secure reset token.</p>
    </div>

    <form id="forgotForm">
      <div class="form-group">
        <label for="forgotEmail" class="form-label">Email Address</label>
        <input 
          type="email" 
          id="forgotEmail" 
          class="form-input" 
          placeholder="alex@fitness.com" 
          required 
          autocomplete="email"
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.75rem;">
        Request Reset Token
      </button>
    </form>

    <div id="resetTokenNotice"></div>

    <div class="auth-footer-text">
      Remembered your password? <a href="login.html">Return to Login</a>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
