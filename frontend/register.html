<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — FitTrack</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body class="auth-wrapper">

  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="brand-logo" style="justify-content: center;">
        <div class="brand-icon">F</div>
        <span>Fit<span class="text-primary">Track</span></span>
      </a>
      <h2 class="auth-title">Create Free Account</h2>
      <p class="auth-subtitle">Join thousands of athletes tracking their daily fitness.</p>
    </div>

    <form id="registerForm">
      <div class="form-group">
        <label for="regName" class="form-label">Full Name</label>
        <input 
          type="text" 
          id="regName" 
          class="form-input" 
          placeholder="Alex Johnson" 
          required 
          autocomplete="name"
        >
      </div>

      <div class="form-group">
        <label for="regEmail" class="form-label">Email Address</label>
        <input 
          type="email" 
          id="regEmail" 
          class="form-input" 
          placeholder="alex@fitness.com" 
          required 
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="regPassword" class="form-label">Create Password</label>
        <input 
          type="password" 
          id="regPassword" 
          class="form-input" 
          placeholder="Min. 6 characters" 
          required 
          minlength="6"
          autocomplete="new-password"
        >
      </div>

      <div class="form-group">
        <label for="regConfirmPassword" class="form-label">Confirm Password</label>
        <input 
          type="password" 
          id="regConfirmPassword" 
          class="form-input" 
          placeholder="Repeat password" 
          required 
          minlength="6"
          autocomplete="new-password"
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.75rem;">
        Create Free Account
      </button>
    </form>

    <div class="auth-footer-text">
      Already have an account? <a href="login.html">Sign In</a>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    redirectIfAuth();
  </script>
</body>
</html>
